<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="LnGLuN4-mBdBtDTQ_VAxWvk4YK_SZhQMHmLJhfP4w0o" />
    <title>Orbit Component Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        @keyframes floatY {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-20px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes globeSpin {
            from { background-position: 0 0; }
            to { background-position: 200% 0; }
        }
    </style>
</head>
<body>

    <!-- Start Component -->
    <div class="w-full lg:w-[50%] h-[420px] lg:h-[600px] relative flex items-center justify-center" style="opacity: 1;">
        
        <!-- Center Floating Container -->
        <div class="absolute w-0 h-0" style="top: 50%; left: 50%; animation: 7s ease-in-out 0s infinite normal none running floatY;">
            
            <!-- Ring 1 -->
            <div class="absolute top-1/2 left-1/2 rounded-full border border-white/[0.08]" style="width: 220px; height: 220px; margin-top: -110px; margin-left: -110px;">
                <div style="animation: 18s linear 0s infinite normal none running spin; width: 100%; height: 100%; position: relative;">
                    <div class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2">
                        <div class="group flex flex-col items-center cursor-pointer">
                            <div style="animation: 18s linear 0s infinite reverse none running spin; display: flex; flex-direction: column; align-items: center;">
                                <div class="w-3 h-3 bg-[#eab308]/80 rounded-full shadow-[0_0_14px_rgba(234,179,8,0.7)] group-hover:bg-[#eab308] group-hover:shadow-[0_0_28px_rgba(234,179,8,1)] transition-all duration-300"></div>
                                <span class="mt-2 text-[11px] text-[#bbb] font-medium tracking-widest opacity-75 group-hover:opacity-100 group-hover:text-white transition-all duration-300 whitespace-nowrap uppercase">Supertechno 50+</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ring 2 -->
            <div class="absolute top-1/2 left-1/2 rounded-full border border-white/[0.08]" style="width: 310px; height: 310px; margin-top: -155px; margin-left: -155px;">
                <div style="animation: 26s linear 0s infinite normal none running spin; width: 100%; height: 100%; position: relative;">
                    <div class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2">
                        <div class="group flex flex-col items-center cursor-pointer">
                            <div style="animation: 26s linear 0s infinite reverse none running spin; display: flex; flex-direction: column; align-items: center;">
                                <div class="w-3 h-3 bg-[#eab308]/80 rounded-full shadow-[0_0_14px_rgba(234,179,8,0.7)] group-hover:bg-[#eab308] group-hover:shadow-[0_0_28px_rgba(234,179,8,1)] transition-all duration-300"></div>
                                <span class="mt-2 text-[11px] text-[#bbb] font-medium tracking-widest opacity-75 group-hover:opacity-100 group-hover:text-white transition-all duration-300 whitespace-nowrap uppercase">Operator Service</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ring 3 -->
            <div class="absolute top-1/2 left-1/2 rounded-full border border-white/[0.08]" style="width: 400px; height: 400px; margin-top: -200px; margin-left: -200px;">
                <div style="animation: 22s linear 0s infinite normal none running spin; width: 100%; height: 100%; position: relative;">
                    <div class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2">
                        <div class="group flex flex-col items-center cursor-pointer">
                            <div style="animation: 22s linear 0s infinite reverse none running spin; display: flex; flex-direction: column; align-items: center;">
                                <div class="w-3 h-3 bg-[#eab308]/80 rounded-full shadow-[0_0_14px_rgba(234,179,8,0.7)] group-hover:bg-[#eab308] group-hover:shadow-[0_0_28px_rgba(234,179,8,1)] transition-all duration-300"></div>
                                <span class="mt-2 text-[11px] text-[#bbb] font-medium tracking-widest opacity-75 group-hover:opacity-100 group-hover:text-white transition-all duration-300 whitespace-nowrap uppercase">Remote Head Z</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ring 4 -->
            <div class="absolute top-1/2 left-1/2 rounded-full border border-white/[0.08] hidden sm:block" style="width: 490px; height: 490px; margin-top: -245px; margin-left: -245px;">
                <div style="animation: 30s linear 0s infinite normal none running spin; width: 100%; height: 100%; position: relative;">
                    <div class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2">
                        <div class="group flex flex-col items-center cursor-pointer">
                            <div style="animation: 30s linear 0s infinite reverse none running spin; display: flex; flex-direction: column; align-items: center;">
                                <div class="w-3 h-3 bg-[#eab308]/80 rounded-full shadow-[0_0_14px_rgba(234,179,8,0.7)] group-hover:bg-[#eab308] group-hover:shadow-[0_0_28px_rgba(234,179,8,1)] transition-all duration-300"></div>
                                <span class="mt-2 text-[11px] text-[#bbb] font-medium tracking-widest opacity-75 group-hover:opacity-100 group-hover:text-white transition-all duration-300 whitespace-nowrap uppercase">Live Broadcast</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ring 5 -->
            <div class="absolute top-1/2 left-1/2 rounded-full border border-white/[0.08] hidden lg:block" style="width: 580px; height: 580px; margin-top: -290px; margin-left: -290px;">
                <div style="animation: 35s linear 0s infinite normal none running spin; width: 100%; height: 100%; position: relative;">
                    <div class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2">
                        <div class="group flex flex-col items-center cursor-pointer">
                            <div style="animation: 35s linear 0s infinite reverse none running spin; display: flex; flex-direction: column; align-items: center;">
                                <div class="w-3 h-3 bg-[#eab308]/80 rounded-full shadow-[0_0_14px_rgba(234,179,8,0.7)] group-hover:bg-[#eab308] group-hover:shadow-[0_0_28px_rgba(234,179,8,1)] transition-all duration-300"></div>
                                <span class="mt-2 text-[11px] text-[#bbb] font-medium tracking-widest opacity-75 group-hover:opacity-100 group-hover:text-white transition-all duration-300 whitespace-nowrap uppercase">Cinema Production</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Globe / Image -->
            <div class="absolute rounded-full overflow-hidden border border-white/15" style="width: 130px; height: 130px; top: -65px; left: -65px; box-shadow: rgba(255, 255, 255, 0.18) 0px 0px 60px, rgba(234, 179, 8, 0.3) 0px 0px 0px 1px;">
                <div class="absolute inset-0 w-full h-full" style="background-image: url('assets/images/crane_50.png'); background-size: cover; background-position: center;"></div>
                <div class="absolute inset-0 rounded-full pointer-events-none" style="box-shadow: rgba(0, 0, 0, 0.85) -16px -10px 28px inset, rgba(255, 255, 255, 0.35) 6px 6px 18px inset; mix-blend-mode: hard-light;"></div>
                <div class="absolute inset-0 rounded-full pointer-events-none" style="box-shadow: rgba(234, 179, 8, 0.2) 0px 0px 20px 4px;"></div>
            </div>

        </div>
    </div>
    <!-- End Component -->

</body>
</html>
